<svg xmlns="http://www.w3.org/2000/svg" width="1232" height="676" viewBox="0 0 1232 676"
     role="img" aria-labelledby="t d">
  <title id="t">Eclipse system architecture</title>
  <desc id="d">Six planes on one event bus, top to bottom: data, measurement, research,
  governance, execution, observability. Each plane lists the components it owns.</desc>

  <rect width="1232" height="676" fill="#07090D"/>

  <!-- the rail -->
  <line x1="176" y1="40" x2="176" y2="640" stroke="#FFFFFF" stroke-opacity=".09"/>

  <text x="40" y="34" fill="#5C6675"
        font-family="ui-monospace, 'Cascadia Mono', Consolas, 'SF Mono', Menlo, monospace"
        font-size="11" letter-spacing="3.4">SYSTEM ARCHITECTURE</text>
  <line x1="40" y1="46" x2="1160" y2="46" stroke="#FFFFFF" stroke-opacity=".09"/>

  <!-- ============ 1 · DATA ============ -->
  <text x="40" y="90" fill="#98A2B3" font-family="ui-monospace, 'Cascadia Mono', Consolas, monospace" font-size="11" letter-spacing="2.2">DATA</text>
  <text x="40" y="106" fill="#5C6675" font-family="ui-monospace, 'Cascadia Mono', Consolas, monospace" font-size="9.5" letter-spacing="1.6">what arrived</text>
  <circle cx="176" cy="86" r="3.4" fill="#22D3EE"/>
  <circle cx="176" cy="86" r="8" fill="none" stroke="#22D3EE" stroke-opacity=".3"/>
  <rect x="210" y="62" width="954" height="60" rx="2" fill="#0C0F14" stroke="#FFFFFF" stroke-opacity=".09"/>
  <g font-family="ui-monospace, 'Cascadia Mono', Consolas, monospace" font-size="11.5" fill="#E8ECF2">
    <rect x="228" y="78" width="212" height="28" rx="2" fill="#11151C" stroke="#FFFFFF" stroke-opacity=".16"/><text x="243" y="96">Exchange streams</text>
    <rect x="456" y="78" width="212" height="28" rx="2" fill="#11151C" stroke="#FFFFFF" stroke-opacity=".16"/><text x="471" y="96">Collectors</text>
    <rect x="684" y="78" width="212" height="28" rx="2" fill="#11151C" stroke="#FFFFFF" stroke-opacity=".16"/><text x="699" y="96">Append-only stores</text>
    <rect x="912" y="78" width="234" height="28" rx="2" fill="#11151C" stroke="#FFFFFF" stroke-opacity=".16"/><text x="927" y="96">Rotation and archive</text>
  </g>

  <!-- ============ 2 · MEASUREMENT ============ -->
  <text x="40" y="186" fill="#98A2B3" font-family="ui-monospace, 'Cascadia Mono', Consolas, monospace" font-size="11" letter-spacing="2.2">MEASUREMENT</text>
  <text x="40" y="202" fill="#5C6675" font-family="ui-monospace, 'Cascadia Mono', Consolas, monospace" font-size="9.5" letter-spacing="1.6">what is visible</text>
  <circle cx="176" cy="182" r="3.4" fill="#22D3EE"/>
  <circle cx="176" cy="182" r="8" fill="none" stroke="#22D3EE" stroke-opacity=".3"/>
  <rect x="210" y="158" width="954" height="60" rx="2" fill="#0C0F14" stroke="#FFFFFF" stroke-opacity=".09"/>
  <g font-family="ui-monospace, 'Cascadia Mono', Consolas, monospace" font-size="11.5" fill="#E8ECF2">
    <rect x="228" y="174" width="212" height="28" rx="2" fill="#11151C" stroke="#FFFFFF" stroke-opacity=".16"/><text x="243" y="192">Coverage at use</text>
    <rect x="456" y="174" width="212" height="28" rx="2" fill="#11151C" stroke="#FFFFFF" stroke-opacity=".16"/><text x="471" y="192">Join health</text>
    <rect x="684" y="174" width="212" height="28" rx="2" fill="#11151C" stroke="#FFFFFF" stroke-opacity=".16"/><text x="699" y="192">Event vs local time</text>
    <rect x="912" y="174" width="234" height="28" rx="2" fill="#11151C" stroke="#FFFFFF" stroke-opacity=".16"/><text x="927" y="192">Missingness</text>
  </g>

  <!-- ============ 3 · RESEARCH ============ -->
  <text x="40" y="282" fill="#98A2B3" font-family="ui-monospace, 'Cascadia Mono', Consolas, monospace" font-size="11" letter-spacing="2.2">RESEARCH</text>
  <text x="40" y="298" fill="#5C6675" font-family="ui-monospace, 'Cascadia Mono', Consolas, monospace" font-size="9.5" letter-spacing="1.6">what is asked</text>
  <circle cx="176" cy="278" r="3.4" fill="#A78BFA"/>
  <circle cx="176" cy="278" r="8" fill="none" stroke="#A78BFA" stroke-opacity=".3"/>
  <rect x="210" y="254" width="954" height="60" rx="2" fill="#0C0F14" stroke="#FFFFFF" stroke-opacity=".09"/>
  <g font-family="ui-monospace, 'Cascadia Mono', Consolas, monospace" font-size="11.5" fill="#E8ECF2">
    <rect x="228" y="270" width="166" height="28" rx="2" fill="#11151C" stroke="#FFFFFF" stroke-opacity=".16"/><text x="243" y="288">Question</text>
    <rect x="410" y="270" width="166" height="28" rx="2" fill="#11151C" stroke="#FFFFFF" stroke-opacity=".16"/><text x="425" y="288">Identifiability</text>
    <rect x="592" y="270" width="166" height="28" rx="2" fill="#11151C" stroke="#FFFFFF" stroke-opacity=".16"/><text x="607" y="288">Frozen contract</text>
    <rect x="774" y="270" width="166" height="28" rx="2" fill="#11151C" stroke="#FFFFFF" stroke-opacity=".16"/><text x="789" y="288">Engines</text>
    <rect x="956" y="270" width="190" height="28" rx="2" fill="#11151C" stroke="#FFFFFF" stroke-opacity=".16"/><text x="971" y="288">Evaluator</text>
  </g>

  <!-- ============ 4 · GOVERNANCE ============ -->
  <text x="40" y="378" fill="#98A2B3" font-family="ui-monospace, 'Cascadia Mono', Consolas, monospace" font-size="11" letter-spacing="2.2">GOVERNANCE</text>
  <text x="40" y="394" fill="#5C6675" font-family="ui-monospace, 'Cascadia Mono', Consolas, monospace" font-size="9.5" letter-spacing="1.6">what may be claimed</text>
  <circle cx="176" cy="374" r="3.4" fill="#A78BFA"/>
  <circle cx="176" cy="374" r="8" fill="none" stroke="#A78BFA" stroke-opacity=".3"/>
  <rect x="210" y="350" width="954" height="60" rx="2" fill="#0C0F14" stroke="#FFFFFF" stroke-opacity=".09"/>
  <g font-family="ui-monospace, 'Cascadia Mono', Consolas, monospace" font-size="11.5" fill="#E8ECF2">
    <rect x="228" y="366" width="166" height="28" rx="2" fill="#11151C" stroke="#FFFFFF" stroke-opacity=".16"/><text x="243" y="384">Preregistration</text>
    <rect x="410" y="366" width="166" height="28" rx="2" fill="#11151C" stroke="#FFFFFF" stroke-opacity=".16"/><text x="425" y="384">Hypothesis ledger</text>
    <rect x="592" y="366" width="166" height="28" rx="2" fill="#11151C" stroke="#FFFFFF" stroke-opacity=".16"/><text x="607" y="384">Decision log</text>
    <rect x="774" y="366" width="166" height="28" rx="2" fill="#11151C" stroke="#FFFFFF" stroke-opacity=".16"/><text x="789" y="384">Failure archive</text>
    <rect x="956" y="366" width="190" height="28" rx="2" fill="#11151C" stroke="#FFFFFF" stroke-opacity=".16"/><text x="971" y="384">Review gate</text>
  </g>

  <!-- ============ 5 · EXECUTION ============ -->
  <text x="40" y="474" fill="#98A2B3" font-family="ui-monospace, 'Cascadia Mono', Consolas, monospace" font-size="11" letter-spacing="2.2">EXECUTION</text>
  <text x="40" y="490" fill="#5C6675" font-family="ui-monospace, 'Cascadia Mono', Consolas, monospace" font-size="9.5" letter-spacing="1.6">what may act</text>
  <circle cx="176" cy="470" r="3.4" fill="#4D7CFF"/>
  <circle cx="176" cy="470" r="8" fill="none" stroke="#4D7CFF" stroke-opacity=".3"/>
  <rect x="210" y="446" width="954" height="60" rx="2" fill="#0C0F14" stroke="#FFFFFF" stroke-opacity=".09"/>
  <g font-family="ui-monospace, 'Cascadia Mono', Consolas, monospace" font-size="11.5" fill="#E8ECF2">
    <rect x="228" y="462" width="166" height="28" rx="2" fill="#11151C" stroke="#FFFFFF" stroke-opacity=".16"/><text x="243" y="480">Entry gate</text>
    <rect x="410" y="462" width="166" height="28" rx="2" fill="#11151C" stroke="#FFFFFF" stroke-opacity=".16"/><text x="425" y="480">Risk bounds</text>
    <rect x="592" y="462" width="166" height="28" rx="2" fill="#11151C" stroke="#FFFFFF" stroke-opacity=".16"/><text x="607" y="480">Order router</text>
    <rect x="774" y="462" width="166" height="28" rx="2" fill="#11151C" stroke="#FFFFFF" stroke-opacity=".16"/><text x="789" y="480">Verifier</text>
    <rect x="956" y="462" width="190" height="28" rx="2" fill="#11151C" stroke="#FFFFFF" stroke-opacity=".16"/><text x="971" y="480">Reconcile</text>
  </g>

  <!-- ============ 6 · OBSERVABILITY ============ -->
  <text x="40" y="570" fill="#98A2B3" font-family="ui-monospace, 'Cascadia Mono', Consolas, monospace" font-size="11" letter-spacing="2.2">OBSERVABILITY</text>
  <text x="40" y="586" fill="#5C6675" font-family="ui-monospace, 'Cascadia Mono', Consolas, monospace" font-size="9.5" letter-spacing="1.6">what happened</text>
  <circle cx="176" cy="566" r="3.4" fill="#4D7CFF"/>
  <circle cx="176" cy="566" r="8" fill="none" stroke="#4D7CFF" stroke-opacity=".3"/>
  <rect x="210" y="542" width="954" height="60" rx="2" fill="#0C0F14" stroke="#FFFFFF" stroke-opacity=".09"/>
  <g font-family="ui-monospace, 'Cascadia Mono', Consolas, monospace" font-size="11.5" fill="#E8ECF2">
    <rect x="228" y="558" width="212" height="28" rx="2" fill="#11151C" stroke="#FFFFFF" stroke-opacity=".16"/><text x="243" y="576">Intent ledger</text>
    <rect x="456" y="558" width="212" height="28" rx="2" fill="#11151C" stroke="#FFFFFF" stroke-opacity=".16"/><text x="471" y="576">Event journal</text>
    <rect x="684" y="558" width="212" height="28" rx="2" fill="#11151C" stroke="#FFFFFF" stroke-opacity=".16"/><text x="699" y="576">Telemetry</text>
    <rect x="912" y="558" width="234" height="28" rx="2" fill="#11151C" stroke="#FFFFFF" stroke-opacity=".16"/><text x="927" y="576">Read-only dashboards</text>
  </g>

  <!-- the publication boundary: the two private planes, bracketed -->
  <path d="M 1176 254 h 10 v 156 h -10" fill="none" stroke="#A78BFA" stroke-opacity=".5"/>
  <text transform="translate(1198,332) rotate(-90)" text-anchor="middle" fill="#A78BFA"
        font-family="ui-monospace, 'Cascadia Mono', Consolas, monospace" font-size="10" letter-spacing="2.2">PRIVATE RESEARCH ESTATE</text>
  <path d="M 1176 62 h 10 v 156 h -10" fill="none" stroke="#FFFFFF" stroke-opacity=".18"/>
  <path d="M 1176 446 h 10 v 156 h -10" fill="none" stroke="#FFFFFF" stroke-opacity=".18"/>
  <text transform="translate(1198,140) rotate(-90)" text-anchor="middle" fill="#5C6675"
        font-family="ui-monospace, 'Cascadia Mono', Consolas, monospace" font-size="10" letter-spacing="2.2">PUBLIC FRAMEWORK</text>
  <text transform="translate(1198,524) rotate(-90)" text-anchor="middle" fill="#5C6675"
        font-family="ui-monospace, 'Cascadia Mono', Consolas, monospace" font-size="10" letter-spacing="2.2">PUBLIC FRAMEWORK</text>

  <line x1="210" y1="428" x2="1164" y2="428" stroke="#FFFFFF" stroke-opacity=".16" stroke-dasharray="3 6"/>
  <text x="1164" y="422" text-anchor="end" fill="#5C6675"
        font-family="ui-monospace, 'Cascadia Mono', Consolas, monospace" font-size="10" letter-spacing="1.6">RESEARCH NEVER REACHES ACROSS THIS LINE</text>

  <line x1="40" y1="640" x2="1160" y2="640" stroke="#FFFFFF" stroke-opacity=".09"/>
  <text x="40" y="662" fill="#5C6675"
        font-family="ui-monospace, 'Cascadia Mono', Consolas, monospace" font-size="10" letter-spacing="1.4">A PLANE MAY READ THE ONE ABOVE IT. NO PLANE MAY WRITE TO THE ONE ABOVE IT.</text>
</svg>
