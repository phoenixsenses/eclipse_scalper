<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="580" viewBox="0 0 1200 580"
     role="img" aria-labelledby="t d">
  <title id="t">Queue race at the top of the book — illustrative</title>
  <desc id="d">An illustrative diagram of the best bid and best ask queues draining toward a
  first-passage race that sets the next price. No measured value appears in this figure.</desc>

  <defs>
    <marker id="ar2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#98A2B3"/>
    </marker>
  </defs>

  <rect width="1200" height="580" fill="#07090D"/>

  <text x="40" y="34" fill="#5C6675" font-family="ui-monospace, 'Cascadia Mono', Consolas, monospace" font-size="11" letter-spacing="3.4">TOP OF BOOK — CONCEPT</text>
  <line x1="40" y1="46" x2="1160" y2="46" stroke="#FFFFFF" stroke-opacity=".09"/>

  <rect x="856" y="16" width="304" height="26" rx="2" fill="#0C0F14" stroke="#FFFFFF" stroke-opacity=".28"/>
  <text x="1145" y="34" text-anchor="end" fill="#E8ECF2"
        font-family="ui-monospace, 'Cascadia Mono', Consolas, monospace" font-size="10.5" letter-spacing="1.4">ILLUSTRATIVE — NOT TRADING OUTPUT</text>

  <!-- price axis -->
  <text transform="translate(58,270) rotate(-90)" fill="#5C6675"
        font-family="ui-monospace, 'Cascadia Mono', Consolas, monospace" font-size="10" letter-spacing="2.4">PRICE</text>
  <line x1="86" y1="140" x2="86" y2="380" stroke="#FFFFFF" stroke-opacity=".16" marker-end="url(#ar2)"/>

  <!-- ask side -->
  <text x="612" y="140" fill="#22D3EE" font-family="ui-monospace, 'Cascadia Mono', Consolas, monospace" font-size="11" letter-spacing="2.2">BEST ASK QUEUE</text>
  <g fill="#22D3EE" stroke="#22D3EE" stroke-opacity=".45">
    <rect x="610" y="156" width="34" height="28" rx="1" fill-opacity=".34"/>
    <rect x="647" y="156" width="34" height="28" rx="1" fill-opacity=".30"/>
    <rect x="684" y="156" width="34" height="28" rx="1" fill-opacity=".26"/>
    <rect x="721" y="156" width="34" height="28" rx="1" fill-opacity=".22"/>
    <rect x="758" y="156" width="34" height="28" rx="1" fill-opacity=".18"/>
    <rect x="795" y="156" width="34" height="28" rx="1" fill-opacity=".14"/>
    <rect x="832" y="156" width="34" height="28" rx="1" fill-opacity=".11"/>
    <rect x="869" y="156" width="34" height="28" rx="1" fill-opacity=".08"/>
    <rect x="906" y="156" width="34" height="28" rx="1" fill-opacity=".06"/>
    <rect x="943" y="156" width="34" height="28" rx="1" fill-opacity=".04"/>
  </g>
  <line x1="1010" y1="170" x2="666" y2="170" stroke="#98A2B3" stroke-opacity=".6" stroke-dasharray="4 4" marker-end="url(#ar2)"/>
  <text x="1020" y="166" fill="#98A2B3" font-family="system-ui, 'Segoe UI', sans-serif" font-size="12">drains toward</text>
  <text x="1020" y="182" fill="#98A2B3" font-family="system-ui, 'Segoe UI', sans-serif" font-size="12">the touch</text>

  <!-- mid -->
  <line x1="180" y1="250" x2="1020" y2="250" stroke="#FFFFFF" stroke-opacity=".14" stroke-dasharray="2 6"/>
  <text x="180" y="244" fill="#5C6675" font-family="ui-monospace, 'Cascadia Mono', Consolas, monospace" font-size="10" letter-spacing="1.8">MID</text>

  <!-- bid side -->
  <text x="588" y="380" text-anchor="end" fill="#4D7CFF" font-family="ui-monospace, 'Cascadia Mono', Consolas, monospace" font-size="11" letter-spacing="2.2">BEST BID QUEUE</text>
  <g fill="#4D7CFF" stroke="#4D7CFF" stroke-opacity=".45">
    <rect x="556" y="316" width="34" height="28" rx="1" fill-opacity=".34"/>
    <rect x="519" y="316" width="34" height="28" rx="1" fill-opacity=".30"/>
    <rect x="482" y="316" width="34" height="28" rx="1" fill-opacity=".26"/>
    <rect x="445" y="316" width="34" height="28" rx="1" fill-opacity=".22"/>
    <rect x="408" y="316" width="34" height="28" rx="1" fill-opacity=".18"/>
    <rect x="371" y="316" width="34" height="28" rx="1" fill-opacity=".14"/>
    <rect x="334" y="316" width="34" height="28" rx="1" fill-opacity=".11"/>
    <rect x="297" y="316" width="34" height="28" rx="1" fill-opacity=".08"/>
    <rect x="260" y="316" width="34" height="28" rx="1" fill-opacity=".06"/>
    <rect x="223" y="316" width="34" height="28" rx="1" fill-opacity=".04"/>
  </g>
  <line x1="190" y1="330" x2="534" y2="330" stroke="#98A2B3" stroke-opacity=".6" stroke-dasharray="4 4" marker-end="url(#ar2)"/>
  <text x="182" y="326" text-anchor="end" fill="#98A2B3" font-family="system-ui, 'Segoe UI', sans-serif" font-size="12">drains toward</text>
  <text x="182" y="342" text-anchor="end" fill="#98A2B3" font-family="system-ui, 'Segoe UI', sans-serif" font-size="12">the touch</text>

  <!-- the race -->
  <rect x="592" y="200" width="16" height="100" rx="1" fill="#A78BFA" fill-opacity=".10" stroke="#A78BFA" stroke-opacity=".45"/>
  <text x="600" y="292" text-anchor="middle" fill="#A78BFA"
        font-family="ui-monospace, 'Cascadia Mono', Consolas, monospace" font-size="10" letter-spacing="1.4"> </text>

  <line x1="600" y1="196" x2="600" y2="112" stroke="#A78BFA" stroke-opacity=".45"/>
  <text x="600" y="102" text-anchor="middle" fill="#A78BFA"
        font-family="ui-monospace, 'Cascadia Mono', Consolas, monospace" font-size="11" letter-spacing="2">FIRST PASSAGE</text>

  <!-- what emptying actually means -->
  <rect x="180" y="424" width="450" height="106" rx="2" fill="#0C0F14" stroke="#FFFFFF" stroke-opacity=".09"/>
  <text x="204" y="452" fill="#E8ECF2" font-family="ui-monospace, 'Cascadia Mono', Consolas, monospace" font-size="12.5">A level can empty two ways</text>
  <text x="204" y="478" fill="#98A2B3" font-family="system-ui, 'Segoe UI', sans-serif" font-size="12.5">Trades consume it. Cancels withdraw it. Refills replace it.</text>
  <text x="204" y="498" fill="#98A2B3" font-family="system-ui, 'Segoe UI', sans-serif" font-size="12.5">Displayed quantity is therefore not a countdown, and any</text>
  <text x="204" y="518" fill="#98A2B3" font-family="system-ui, 'Segoe UI', sans-serif" font-size="12.5">fill model that treats it as one will be wrong in one direction.</text>

  <rect x="660" y="424" width="500" height="106" rx="2" fill="#0C0F14" stroke="#FFFFFF" stroke-opacity=".09"/>
  <text x="684" y="452" fill="#E8ECF2" font-family="ui-monospace, 'Cascadia Mono', Consolas, monospace" font-size="12.5">Reachability, not queue position</text>
  <text x="684" y="478" fill="#98A2B3" font-family="system-ui, 'Segoe UI', sans-serif" font-size="12.5">Asking whether a trade printed through a price is a weaker</text>
  <text x="684" y="498" fill="#98A2B3" font-family="system-ui, 'Segoe UI', sans-serif" font-size="12.5">question than asking where in the queue an order stood — and</text>
  <text x="684" y="518" fill="#98A2B3" font-family="system-ui, 'Segoe UI', sans-serif" font-size="12.5">it is the one the data can actually answer.</text>

  <text x="1160" y="566" text-anchor="end" fill="#3A424F"
        font-family="ui-monospace, 'Cascadia Mono', Consolas, monospace" font-size="10" letter-spacing="1.4">COLOUR MARKS A SIDE OF THE BOOK, NOT A STATE.</text>
</svg>
