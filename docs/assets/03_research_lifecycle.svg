<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="768" viewBox="0 0 1200 768"
     role="img" aria-labelledby="t d">
  <title id="t">Eclipse research lifecycle</title>
  <desc id="d">Nine stages from observation to operational validation, with the terminal
  state an idea can exit into at each stage.</desc>

  <rect width="1200" height="768" fill="#07090D"/>

  <text x="40" y="34" fill="#5C6675" font-family="ui-monospace, 'Cascadia Mono', Consolas, monospace" font-size="11" letter-spacing="3.4">RESEARCH LIFECYCLE</text>
  <line x1="40" y1="46" x2="1160" y2="46" stroke="#FFFFFF" stroke-opacity=".09"/>
  <text x="1160" y="34" text-anchor="end" fill="#5C6675" font-family="ui-monospace, 'Cascadia Mono', Consolas, monospace" font-size="10" letter-spacing="1.8">AN IDEA MAY LEAVE AT ANY RUNG. IT MAY NOT SKIP ONE.</text>

  <!-- spine -->
  <line x1="150" y1="70" x2="150" y2="708" stroke="#FFFFFF" stroke-opacity=".09"/>

  <g font-family="ui-monospace, 'Cascadia Mono', Consolas, 'SF Mono', Menlo, monospace">

    <!-- 01 -->
    <circle cx="150" cy="92" r="4" fill="#22D3EE"/>
    <text x="40" y="97" fill="#3A424F" font-size="12">01</text>
    <text x="182" y="97" fill="#E8ECF2" font-size="13.5" letter-spacing="1.2">OBSERVE</text>
    <text x="420" y="97" fill="#98A2B3" font-size="12.5" font-family="system-ui, 'Segoe UI', sans-serif">Is there anything here to see at all?</text>
    <line x1="880" y1="92" x2="928" y2="92" stroke="#FFFFFF" stroke-opacity=".16" stroke-dasharray="2 4"/>
    <rect x="934" y="78" width="226" height="28" rx="2" fill="#0C0F14" stroke="#FFFFFF" stroke-opacity=".16"/>
    <text x="949" y="96" fill="#98A2B3" font-size="11">UNOBSERVABLE</text>

    <!-- 02 -->
    <circle cx="150" cy="166" r="4" fill="#22D3EE"/>
    <text x="40" y="171" fill="#3A424F" font-size="12">02</text>
    <text x="182" y="171" fill="#E8ECF2" font-size="13.5" letter-spacing="1.2">MEASUREMENT GATE</text>
    <text x="420" y="171" fill="#98A2B3" font-size="12.5" font-family="system-ui, 'Segoe UI', sans-serif">Is what we see what we think it is?</text>
    <line x1="880" y1="166" x2="928" y2="166" stroke="#FFFFFF" stroke-opacity=".16" stroke-dasharray="2 4"/>
    <rect x="934" y="152" width="226" height="28" rx="2" fill="#0C0F14" stroke="#FFFFFF" stroke-opacity=".16"/>
    <text x="949" y="170" fill="#98A2B3" font-size="11">NOT IDENTIFIED</text>

    <!-- 03 -->
    <circle cx="150" cy="240" r="4" fill="#A78BFA"/>
    <text x="40" y="245" fill="#3A424F" font-size="12">03</text>
    <text x="182" y="245" fill="#E8ECF2" font-size="13.5" letter-spacing="1.2">HYPOTHESIS</text>
    <text x="420" y="245" fill="#98A2B3" font-size="12.5" font-family="system-ui, 'Segoe UI', sans-serif">A statement that could turn out to be wrong.</text>

    <!-- 04 -->
    <circle cx="150" cy="314" r="4" fill="#A78BFA"/>
    <text x="40" y="319" fill="#3A424F" font-size="12">04</text>
    <text x="182" y="319" fill="#E8ECF2" font-size="13.5" letter-spacing="1.2">PREREGISTRATION</text>
    <text x="420" y="319" fill="#98A2B3" font-size="12.5" font-family="system-ui, 'Segoe UI', sans-serif">The rule is frozen before the outcome is opened.</text>
    <line x1="880" y1="314" x2="928" y2="314" stroke="#FFFFFF" stroke-opacity=".16" stroke-dasharray="2 4"/>
    <rect x="934" y="300" width="226" height="28" rx="2" fill="#0C0F14" stroke="#FFFFFF" stroke-opacity=".16"/>
    <text x="949" y="318" fill="#98A2B3" font-size="11">BLOCKED BY DATA</text>

    <!-- 05 -->
    <circle cx="150" cy="388" r="4" fill="#A78BFA"/>
    <text x="40" y="393" fill="#3A424F" font-size="12">05</text>
    <text x="182" y="393" fill="#E8ECF2" font-size="13.5" letter-spacing="1.2">DEVELOPMENT</text>
    <text x="420" y="393" fill="#98A2B3" font-size="12.5" font-family="system-ui, 'Segoe UI', sans-serif">The sample is spent here. It does not come back.</text>
    <line x1="880" y1="388" x2="928" y2="388" stroke="#FFFFFF" stroke-opacity=".16" stroke-dasharray="2 4"/>
    <rect x="934" y="374" width="226" height="28" rx="2" fill="#0C0F14" stroke="#FFFFFF" stroke-opacity=".16"/>
    <text x="949" y="392" fill="#98A2B3" font-size="11">BURNED SAMPLE</text>

    <!-- 06 -->
    <circle cx="150" cy="462" r="4" fill="#A78BFA"/>
    <text x="40" y="467" fill="#3A424F" font-size="12">06</text>
    <text x="182" y="467" fill="#E8ECF2" font-size="13.5" letter-spacing="1.2">FALSIFICATION</text>
    <text x="420" y="467" fill="#98A2B3" font-size="12.5" font-family="system-ui, 'Segoe UI', sans-serif">Attempts to kill it, not attempts to confirm it.</text>
    <line x1="880" y1="462" x2="928" y2="462" stroke="#FFFFFF" stroke-opacity=".16" stroke-dasharray="2 4"/>
    <rect x="934" y="448" width="226" height="28" rx="2" fill="#0C0F14" stroke="#FFFFFF" stroke-opacity=".16"/>
    <text x="949" y="466" fill="#98A2B3" font-size="11">REFUTED</text>

    <!-- 07 -->
    <circle cx="150" cy="536" r="4" fill="#4D7CFF"/>
    <text x="40" y="541" fill="#3A424F" font-size="12">07</text>
    <text x="182" y="541" fill="#E8ECF2" font-size="13.5" letter-spacing="1.2">FRESH REPLICATION</text>
    <text x="420" y="541" fill="#98A2B3" font-size="12.5" font-family="system-ui, 'Segoe UI', sans-serif">A window the hypothesis has never touched.</text>
    <line x1="880" y1="536" x2="928" y2="536" stroke="#FFFFFF" stroke-opacity=".16" stroke-dasharray="2 4"/>
    <rect x="934" y="522" width="226" height="28" rx="2" fill="#0C0F14" stroke="#FFFFFF" stroke-opacity=".16"/>
    <text x="949" y="540" fill="#98A2B3" font-size="11">NOT REPLICATED</text>

    <!-- 08 -->
    <circle cx="150" cy="610" r="4" fill="#4D7CFF"/>
    <text x="40" y="615" fill="#3A424F" font-size="12">08</text>
    <text x="182" y="615" fill="#E8ECF2" font-size="13.5" letter-spacing="1.2">ECONOMIC TEST</text>
    <text x="420" y="615" fill="#98A2B3" font-size="12.5" font-family="system-ui, 'Segoe UI', sans-serif">Cost, spread, depth, capacity — before any predictor work.</text>
    <line x1="880" y1="610" x2="928" y2="610" stroke="#FFFFFF" stroke-opacity=".16" stroke-dasharray="2 4"/>
    <rect x="934" y="596" width="226" height="28" rx="2" fill="#0C0F14" stroke="#FFFFFF" stroke-opacity=".16"/>
    <text x="949" y="614" fill="#98A2B3" font-size="11">NOT ECONOMIC</text>

    <!-- 09 -->
    <circle cx="150" cy="684" r="4" fill="#4D7CFF"/>
    <text x="40" y="689" fill="#3A424F" font-size="12">09</text>
    <text x="182" y="689" fill="#E8ECF2" font-size="13.5" letter-spacing="1.2">OPERATIONAL TEST</text>
    <text x="420" y="689" fill="#98A2B3" font-size="12.5" font-family="system-ui, 'Segoe UI', sans-serif">Restart, outage, latency, the operator, the clock.</text>
    <line x1="880" y1="684" x2="928" y2="684" stroke="#FFFFFF" stroke-opacity=".16" stroke-dasharray="2 4"/>
    <rect x="934" y="670" width="226" height="28" rx="2" fill="#0C0F14" stroke="#FFFFFF" stroke-opacity=".16"/>
    <text x="949" y="688" fill="#98A2B3" font-size="11">OPERATIONALLY FRAGILE</text>
  </g>

  <line x1="40" y1="730" x2="1160" y2="730" stroke="#FFFFFF" stroke-opacity=".09"/>
  <text x="40" y="752" fill="#5C6675" font-family="ui-monospace, 'Cascadia Mono', Consolas, monospace" font-size="10" letter-spacing="1.4">A REFUTED IDEA IS RECORDED, NOT DELETED. THE ARCHIVE EXISTS SO IT IS NOT REDISCOVERED.</text>
</svg>
