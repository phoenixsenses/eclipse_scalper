<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="540" viewBox="0 0 1200 540"
     role="img" aria-labelledby="t d">
  <title id="t">Eclipse governance</title>
  <desc id="d">Two chains. Above, a claim moves theory to contract to test to verdict to
  replication. Below, an artifact moves implementation to independent review to correction
  to independent re-review to acceptance, with an operator gate between each phase.</desc>

  <defs>
    <marker id="ar3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#5C6675"/>
    </marker>
  </defs>

  <rect width="1200" height="540" fill="#07090D"/>

  <text x="40" y="34" fill="#5C6675" font-family="ui-monospace, 'Cascadia Mono', Consolas, monospace" font-size="11" letter-spacing="3.4">GOVERNANCE</text>
  <line x1="40" y1="46" x2="1160" y2="46" stroke="#FFFFFF" stroke-opacity=".09"/>

  <!-- ================= chain 1 : the claim ================= -->
  <text x="40" y="88" fill="#A78BFA" font-family="ui-monospace, 'Cascadia Mono', Consolas, monospace" font-size="10.5" letter-spacing="2.2">HOW A CLAIM MOVES</text>

  <g font-family="ui-monospace, 'Cascadia Mono', Consolas, 'SF Mono', Menlo, monospace" font-size="12.5" fill="#E8ECF2">
    <rect x="40"  y="104" width="190" height="60" rx="2" fill="#0C0F14" stroke="#FFFFFF" stroke-opacity=".16"/>
    <text x="62"  y="132">THEORY</text><text x="62"  y="152" fill="#5C6675" font-size="10.5">a mechanism, not a fit</text>

    <rect x="272" y="104" width="190" height="60" rx="2" fill="#0C0F14" stroke="#FFFFFF" stroke-opacity=".16"/>
    <text x="294" y="132">CONTRACT</text><text x="294" y="152" fill="#5C6675" font-size="10.5">frozen before the look</text>

    <rect x="505" y="104" width="190" height="60" rx="2" fill="#0C0F14" stroke="#FFFFFF" stroke-opacity=".16"/>
    <text x="527" y="132">TEST</text><text x="527" y="152" fill="#5C6675" font-size="10.5">tries to kill it</text>

    <rect x="738" y="104" width="190" height="60" rx="2" fill="#0C0F14" stroke="#A78BFA" stroke-opacity=".5"/>
    <text x="760" y="132">VERDICT</text><text x="760" y="152" fill="#5C6675" font-size="10.5">a token, on the record</text>

    <rect x="970" y="104" width="190" height="60" rx="2" fill="#0C0F14" stroke="#FFFFFF" stroke-opacity=".16"/>
    <text x="992" y="132">REPLICATION</text><text x="992" y="152" fill="#5C6675" font-size="10.5">a window never touched</text>
  </g>

  <line x1="234" y1="134" x2="268" y2="134" stroke="#5C6675" marker-end="url(#ar3)"/>
  <line x1="466" y1="134" x2="501" y2="134" stroke="#5C6675" marker-end="url(#ar3)"/>
  <line x1="699" y1="134" x2="734" y2="134" stroke="#5C6675" marker-end="url(#ar3)"/>
  <line x1="932" y1="134" x2="966" y2="134" stroke="#5C6675" marker-end="url(#ar3)"/>

  <!-- verdict values -->
  <path d="M 833 168 L 833 190 L 700 190 L 700 206" fill="none" stroke="#FFFFFF" stroke-opacity=".16"/>
  <path d="M 833 168 L 833 206" fill="none" stroke="#FFFFFF" stroke-opacity=".16"/>
  <path d="M 833 168 L 833 190 L 966 190 L 966 206" fill="none" stroke="#FFFFFF" stroke-opacity=".16"/>

  <g font-family="ui-monospace, 'Cascadia Mono', Consolas, monospace" font-size="10.5">
    <rect x="610" y="206" width="180" height="30" rx="2" fill="#11151C" stroke="#FFFFFF" stroke-opacity=".16"/>
    <text x="628" y="225" fill="#98A2B3" letter-spacing="1.2">REFUTED</text>
    <rect x="743" y="206" width="180" height="30" rx="2" fill="#11151C" stroke="#A78BFA" stroke-opacity=".45"/>
    <text x="761" y="225" fill="#E8ECF2" letter-spacing="1.2">RETAINED</text>
    <rect x="876" y="206" width="180" height="30" rx="2" fill="#11151C" stroke="#FFFFFF" stroke-opacity=".16"/>
    <text x="894" y="225" fill="#98A2B3" letter-spacing="1.2">NOT IDENTIFIED</text>
  </g>
  <text x="40" y="262" fill="#5C6675" font-family="system-ui, 'Segoe UI', sans-serif" font-size="12.5">A refuted idea is archived so it is not rediscovered. <tspan fill="#98A2B3">Not identified</tspan> is a third answer, not a soft no.</text>

  <line x1="40" y1="296" x2="1160" y2="296" stroke="#FFFFFF" stroke-opacity=".09"/>

  <!-- ================= chain 2 : the artifact ================= -->
  <text x="40" y="338" fill="#4D7CFF" font-family="ui-monospace, 'Cascadia Mono', Consolas, monospace" font-size="10.5" letter-spacing="2.2">HOW AN ARTIFACT IS ACCEPTED</text>

  <g font-family="ui-monospace, 'Cascadia Mono', Consolas, 'SF Mono', Menlo, monospace" font-size="12" fill="#E8ECF2">
    <rect x="40"  y="354" width="190" height="54" rx="2" fill="#0C0F14" stroke="#FFFFFF" stroke-opacity=".16"/>
    <text x="62"  y="386">IMPLEMENTATION</text>
    <rect x="272" y="354" width="190" height="54" rx="2" fill="#0C0F14" stroke="#FFFFFF" stroke-opacity=".16"/>
    <text x="294" y="380">INDEPENDENT</text><text x="294" y="396">REVIEW</text>
    <rect x="505" y="354" width="190" height="54" rx="2" fill="#0C0F14" stroke="#FFFFFF" stroke-opacity=".16"/>
    <text x="527" y="386">CORRECTION</text>
    <rect x="738" y="354" width="190" height="54" rx="2" fill="#0C0F14" stroke="#FFFFFF" stroke-opacity=".16"/>
    <text x="760" y="380">INDEPENDENT</text><text x="760" y="396">RE-REVIEW</text>
    <rect x="970" y="354" width="190" height="54" rx="2" fill="#0C0F14" stroke="#4D7CFF" stroke-opacity=".5"/>
    <text x="992" y="386">ACCEPTANCE</text>
  </g>

  <g stroke="#5C6675">
    <line x1="234" y1="381" x2="268" y2="381" marker-end="url(#ar3)"/>
    <line x1="466" y1="381" x2="501" y2="381" marker-end="url(#ar3)"/>
    <line x1="699" y1="381" x2="734" y2="381" marker-end="url(#ar3)"/>
    <line x1="932" y1="381" x2="966" y2="381" marker-end="url(#ar3)"/>
  </g>
  <g fill="#5C6675" font-family="ui-monospace, 'Cascadia Mono', Consolas, monospace" font-size="9" letter-spacing="1">
    <circle cx="251" cy="381" r="5" fill="none" stroke="#5C6675"/>
    <circle cx="483" cy="381" r="5" fill="none" stroke="#5C6675"/>
    <circle cx="716" cy="381" r="5" fill="none" stroke="#5C6675"/>
    <circle cx="949" cy="381" r="5" fill="none" stroke="#5C6675"/>
    <text x="251" y="428" text-anchor="middle">GATE</text>
    <text x="483" y="428" text-anchor="middle">GATE</text>
    <text x="716" y="428" text-anchor="middle">GATE</text>
    <text x="949" y="428" text-anchor="middle">GATE</text>
  </g>

  <text x="40" y="470" fill="#98A2B3" font-family="system-ui, 'Segoe UI', sans-serif" font-size="13">Each phase runs separately. A review is read-only and changes nothing; corrections happen in their own phase.</text>
  <text x="40" y="492" fill="#98A2B3" font-family="system-ui, 'Segoe UI', sans-serif" font-size="13">The value of a review is its independence — an author who approves their own work in the same pass has approved nothing.</text>

  <line x1="40" y1="510" x2="1160" y2="510" stroke="#FFFFFF" stroke-opacity=".09"/>
  <text x="40" y="532" fill="#5C6675" font-family="ui-monospace, 'Cascadia Mono', Consolas, monospace" font-size="10" letter-spacing="1.4">TIME PRESSURE IS NOT A REASON TO COMPRESS THE CHAIN.</text>
</svg>
